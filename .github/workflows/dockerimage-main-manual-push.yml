name: Dockerimage Main

jobs:
  combine-and-push:
    runs-on: ubuntu-latest
    needs:
      - twitch-drops-miner-tkinter
      - twitch-drops-miner-nicegui
    if: ${{ github.event_name == 'release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: "main"

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=${{ github.event.release.tag_name }}
          else
            VERSION=$(grep "ENV TDM_VERSION_TAG=" Dockerfile | cut -d'=' -f2)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          ARCHS=("x86_64" "aarch64")
          TKINTER_TEMP_TAGS=()
          NICEGUI_TEMP_TAGS=()

          for arch in "${ARCHS[@]}"; do
            TKINTER_TEMP_TAGS+=("anopem/twitch-drops-miner:temp-tkinter-${arch}-${{ github.run_id }}")
            NICEGUI_TEMP_TAGS+=("anopem/twitch-drops-miner:temp-nicegui-${arch}-${{ github.run_id }}")
          done

          # Create version tag
          docker buildx imagetools create \
            -t anopem/twitch-drops-miner:${{ steps.version.outputs.version }} \
            "${TKINTER_TEMP_TAGS[@]}"

          # Create dev tag
          docker buildx imagetools create \
            -t anopem/twitch-drops-miner:16.dev \
            "${TKINTER_TEMP_TAGS[@]}"

          # Create latest tag
          docker buildx imagetools create \
            -t anopem/twitch-drops-miner:latest \
            "${TKINTER_TEMP_TAGS[@]}"

          # Create webui dev version tag
          docker buildx imagetools create \
            -t anopem/twitch-drops-miner:webui-${{ steps.version.outputs.version }} \
            "${NICEGUI_TEMP_TAGS[@]}"

          # Create webui dev tag
          docker buildx imagetools create \
            -t anopem/twitch-drops-miner:webui-16.dev \
            "${NICEGUI_TEMP_TAGS[@]}"

          # Create webui tag
          docker buildx imagetools create \
            -t anopem/twitch-drops-miner:webui \
            "${NICEGUI_TEMP_TAGS[@]}"

      - name: Clean up temp tags
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username": "${{ secrets.DOCKER_NAME }}", "password": "${{ secrets.DOCKER_TOKEN }}"}' https://hub.docker.com/v2/users/login/ | jq -r .token)

          ARCHS=("x86_64" "aarch64")

          for arch in "${ARCHS[@]}"; do
            curl -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/anopem/twitch-drops-miner/tags/temp-tkinter-${arch}-${{ github.run_id }}/"
            curl -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/anopem/twitch-drops-miner/tags/temp-nicegui-${arch}-${{ github.run_id }}/"
          done

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: anopem/twitch-drops-miner
          readme-filepath: ./README.md
